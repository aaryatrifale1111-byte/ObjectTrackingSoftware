
name: Build Windows Application

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name ObjectTrackingSoftware --collect-all PySide6 --collect-all cv2 --collect-all harvesters --collect-all genicam main.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ObjectTrackingSoftware-Windows
          path: dist/ObjectTrackingSoftware/
